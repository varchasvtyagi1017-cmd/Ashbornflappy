<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ashborn Flappy – Tricolour Edition</title>
<style>
  html,body{margin:0;height:100%;background:#10230f;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=360,GROUND=70,GAP=190,STEM=46,G=1400,JUMP=-400;
let H=640,S=1,OX=0,OY=0,DPR=1;
let state='ready',score=0,best=0,t=0,gscroll=0,flash=0,overT=0,flap=0,newBest=false,spin=0;
let pipes=[];
const bird={x:101,y:300,vy:0,rot:0};
try{best=+localStorage.getItem('ashborn_flappy_best')||0}catch(e){}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,3);
  const iw=window.innerWidth,ih=window.innerHeight;
  cv.width=Math.round(iw*DPR);cv.height=Math.round(ih*DPR);
  H=clamp(W*ih/iw,540,800);
  S=Math.min(iw/W,ih/H);
  OX=(iw-W*S)/2;OY=(ih-H*S)/2;
  if(state==='ready')bird.y=H*0.45;
}

/* ================= SOUND SYSTEM =================
   bg.mp3        -> looping background music (HTMLAudio)
   gameover.mp3  -> game-over sound, plays once (HTMLAudio)
   jump / score  -> original arcade sounds made with the Web Audio API
   One mute flag controls everything. */
const Snd=(()=>{
  let ac=null,master=null,muted=false,primed=false,musicWanted=false;
  try{muted=localStorage.getItem('ashborn_flappy_muted')==='1'}catch(e){}

  const bg=new Audio('bg.mp3');
  bg.loop=true;bg.preload='auto';bg.volume=.5;bg.muted=muted;
  const over=new Audio('gameover.mp3');
  over.preload='auto';over.volume=1;over.muted=muted;

  function init(){
    if(ac)return true;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return false;
      ac=new AC();
      master=ac.createGain();master.gain.value=muted?0:1;master.connect(ac.destination);
      const s=ac.createBufferSource();           // silent buffer: fully unlocks audio on mobile
      s.buffer=ac.createBuffer(1,1,22050);s.connect(ac.destination);s.start(0);
      return true;
    }catch(e){ac=null;return false}
  }
  // Prime the game-over file once during the first tap, so Android lets it play later without a tap.
  function prime(){
    if(primed)return;
    primed=true;
    try{
      over.muted=true;
      const p=over.play();
      if(p&&p.then){
        p.then(()=>{over.pause();over.currentTime=0;over.muted=muted})
         .catch(()=>{over.muted=muted;primed=false});
      }else{over.pause();over.muted=muted}
    }catch(e){over.muted=muted;primed=false}
  }
  function unlock(){
    init();
    if(ac&&ac.state!=='running'){
      try{const p=ac.resume();if(p&&p.catch)p.catch(()=>{})}catch(e){}
    }
    prime();
  }
  function tone(type,f,at,dur,vol,f2){
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,at);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,at+dur);
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(vol,at+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    o.connect(g);g.connect(master);o.start(at);o.stop(at+dur+0.03);
  }

  /* ----- music (bg.mp3) ----- */
  function startMusic(){
    unlock();
    musicWanted=true;
    try{over.pause();over.currentTime=0}catch(e){}
    try{
      bg.currentTime=0;
      const p=bg.play();
      if(p&&p.catch)p.catch(()=>{});
    }catch(e){}
  }
  function stopMusic(){
    musicWanted=false;
    try{bg.pause();bg.currentTime=0}catch(e){}
  }

  /* ----- game over (gameover.mp3, once) ----- */
  function gameOver(){
    try{
      over.muted=muted;
      over.currentTime=0;
      const p=over.play();
      if(p&&p.catch)p.catch(()=>{});
    }catch(e){}
  }

  /* ----- original arcade effects (Web Audio) ----- */
  function flapSfx(){
    if(!ac||muted)return;
    const at=ac.currentTime;
    tone('square',330,at,.11,.12,760);        // quick rising "boing" chirp
    tone('triangle',660,at,.09,.10,1200);
  }
  function scoreSfx(){
    if(!ac||muted)return;
    const at=ac.currentTime;
    tone('square',988,at,.07,.14);            // two-note coin "ding"
    tone('square',1319,at+.07,.16,.14);
  }

  /* ----- mute / unmute everything ----- */
  function toggle(){
    unlock();
    muted=!muted;
    try{localStorage.setItem('ashborn_flappy_muted',muted?'1':'0')}catch(e){}
    bg.muted=muted;over.muted=muted;
    if(master&&ac)master.gain.setTargetAtTime(muted?0:1,ac.currentTime,0.02);
    return muted;
  }
  // pause when the tab/app is hidden, resume when it comes back
  function onVisibility(){
    if(document.hidden){
      try{bg.pause()}catch(e){}
      try{if(ac)ac.suspend()}catch(e){}
    }else{
      try{if(ac){const p=ac.resume();if(p&&p.catch)p.catch(()=>{})}}catch(e){}
      if(musicWanted){try{const p=bg.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
    }
  }
  return {unlock,startMusic,stopMusic,flap:flapSfx,score:scoreSfx,gameOver,
          toggle,isMuted:()=>muted,onVisibility};
})();

/* ---------- game logic ---------- */
function reset(){
  state='ready';score=0;pipes=[];newBest=false;flash=0;
  bird.y=H*0.45;bird.vy=0;bird.rot=0;
}
function flapNow(){bird.vy=JUMP;Snd.flap()}
function startPlay(){state='play';Snd.startMusic();flapNow()}
function press(){
  if(state==='ready')startPlay();
  else if(state==='play')flapNow();
  else if(state==='over'&&overT>0.45){reset();startPlay()}
}
function spawn(){
  const min=70,max=H-GROUND-70-GAP;
  pipes.push({x:W+40,gy:min+Math.random()*(max-min),passed:false});
}
function hit(cx,cy,r,rx,ry,rw,rh){
  const nx=clamp(cx,rx,rx+rw),ny=clamp(cy,ry,ry+rh),dx=cx-nx,dy=cy-ny;
  return dx*dx+dy*dy<r*r;
}
function collide(p){
  const cx=bird.x,cy=bird.y+3,r=13,go=p.gy,bo=p.gy+GAP;
  return hit(cx,cy,r,p.x-STEM/2,0,STEM,go)||hit(cx,cy,r,p.x-29,go-10,58,27)||
         hit(cx,cy,r,p.x-STEM/2,bo,STEM,H)||hit(cx,cy,r,p.x-29,bo-17,58,27);
}
function die(){
  if(state==='over')return;
  state='over';overT=0;flash=1;bird.vy=-160;
  if(score>best){best=score;newBest=true;try{localStorage.setItem('ashborn_flappy_best',String(best))}catch(e){}}
  Snd.stopMusic();
  Snd.gameOver();
}
function update(dt){
  t+=dt;spin+=dt*0.15;flap+=dt*(state==='play'?22:10);
  const speed=125+Math.min(score,40)*1.5;
  if(state!=='over')gscroll+=speed*dt;
  const floorY=H-GROUND-3-13;
  if(state==='ready'){bird.y=H*0.45+Math.sin(t*4)*8;bird.rot=0;return}
  if(state==='play'){
    bird.vy=Math.min(bird.vy+G*dt,650);
    bird.y+=bird.vy*dt;
    bird.rot+=(clamp(bird.vy/520,-0.5,1.2)-bird.rot)*Math.min(1,dt*12);
    if(bird.y<14){bird.y=14;if(bird.vy<0)bird.vy=0}
    for(const p of pipes)p.x-=speed*dt;
    if(pipes.length&&pipes[0].x<-50)pipes.shift();
    const last=pipes[pipes.length-1];
    if(!last||last.x<W-205)spawn();
    for(const p of pipes){
      if(!p.passed&&p.x<bird.x){p.passed=true;score++;Snd.score()}
      if(collide(p)){die();return}
    }
    if(bird.y>=floorY){bird.y=floorY;die()}
  }else{
    overT+=dt;flash=Math.max(0,flash-dt*3);
    if(bird.y<floorY){
      bird.vy=Math.min(bird.vy+1600*dt,800);bird.y=Math.min(floorY,bird.y+bird.vy*dt);
      bird.rot+=(1.4-bird.rot)*Math.min(1,dt*6);
    }
  }
}

/* ---------- drawing helpers ---------- */
function txt(s,x,y,size,fill,stroke,align){
  ctx.font='900 '+size+'px "Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif';
  ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.lineJoin='round';
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=size*.2;ctx.strokeText(s,x,y)}
  ctx.fillStyle=fill;ctx.fillText(s,x,y);
}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function band(y0,y1,c0,c1){
  const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c0);g.addColorStop(1,c1);
  ctx.fillStyle=g;ctx.fillRect(0,y0,W,y1-y0+1);
}
function chakra(cx,cy,r,rot){
  ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);
  ctx.strokeStyle='rgba(0,0,128,.3)';ctx.fillStyle='rgba(0,0,128,.3)';
  ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,r*.12,0,7);ctx.fill();
  ctx.lineWidth=1.6;
  for(let i=0;i<24;i++){
    ctx.save();ctx.rotate(i*Math.PI/12);
    ctx.beginPath();ctx.moveTo(0,r*.12);ctx.lineTo(0,r*.92);ctx.stroke();
    ctx.beginPath();ctx.arc(0,r*.93,2.2,0,7);ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function background(){
  band(0,H/3,'#ffb04a','#ff9933');
  band(H/3,H*2/3,'#ffffff','#f3f3ea');
  band(H*2/3,H,'#1b9c14','#138808');
  chakra(W/2,H/2,48,spin);
}
function ground(){
  const y=H-GROUND;
  ctx.fillStyle='#0b4a14';ctx.fillRect(0,y,W,GROUND);
  ctx.fillStyle='#86d65a';ctx.fillRect(0,y,W,6);
  ctx.fillStyle='rgba(255,255,255,.10)';
  const off=gscroll%28;
  for(let x=-off-28;x<W+28;x+=28){
    ctx.beginPath();ctx.moveTo(x,y+6);ctx.lineTo(x+14,y+6);ctx.lineTo(x+4,y+GROUND);ctx.lineTo(x-10,y+GROUND);ctx.fill();
  }
  ctx.fillStyle='#ff9933';ctx.fillRect(0,y+6,W,3);
}

/* ---------- lotus obstacle ---------- */
let stemGrad,petalGrad;
function makeGradients(){
  stemGrad=ctx.createLinearGradient(-STEM/2,0,STEM/2,0);
  stemGrad.addColorStop(0,'#2f9a3b');stemGrad.addColorStop(.35,'#5fd070');stemGrad.addColorStop(1,'#2b8a36');
  petalGrad=ctx.createLinearGradient(0,0,0,-26);
  petalGrad.addColorStop(0,'#e0307a');petalGrad.addColorStop(1,'#ffc6dc');
}
function flower(){
  ctx.lineWidth=2;ctx.strokeStyle='#0a3d14';ctx.fillStyle='#2e9a3a';
  ctx.beginPath();ctx.ellipse(0,0,29,7,0,0,7);ctx.fill();ctx.stroke();
  for(const a of [-1.1,1.1,-.55,.55,0]){
    ctx.save();ctx.rotate(a);
    ctx.beginPath();ctx.ellipse(0,-13,8.5,13.5,0,0,7);
    ctx.fillStyle=petalGrad;ctx.fill();
    ctx.lineWidth=1.6;ctx.strokeStyle='#9c1a55';ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle='#ffcc33';ctx.beginPath();ctx.ellipse(0,-6,3.5,3,0,0,7);ctx.fill();
}
function obstacle(cx,oy,len,flip){
  ctx.save();
  if(flip){ctx.translate(0,oy);ctx.scale(1,-1);ctx.translate(0,-oy)}
  ctx.translate(cx,0);
  ctx.fillStyle=stemGrad;ctx.fillRect(-STEM/2,oy,STEM,len);
  ctx.strokeStyle='#0a3d14';ctx.lineWidth=2.5;ctx.strokeRect(-STEM/2,oy,STEM,len);
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(10,61,20,.45)';
  for(let y=oy+40;y<oy+len;y+=44){ctx.beginPath();ctx.moveTo(-STEM/2,y);ctx.lineTo(STEM/2,y);ctx.stroke()}
  ctx.translate(0,oy+8);flower();
  ctx.restore();
}
function drawPipes(){
  for(const p of pipes){
    obstacle(p.x,p.gy,p.gy,true);
    obstacle(p.x,p.gy+GAP,H-(p.gy+GAP),false);
  }
}

/* ---------- cartoon hero ---------- */
function drawBird(){
  const skin='#e3a672',line='#2b1d12';
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);
  ctx.lineWidth=2;ctx.strokeStyle=line;ctx.lineJoin='round';
  ctx.fillStyle='#6b3f1d';
  ctx.beginPath();ctx.ellipse(-5,22,4.5,2.8,0,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(5,22,4.5,2.8,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-1,11,13,11,0,0,7);ctx.fill();ctx.stroke();
  ctx.save();ctx.beginPath();ctx.ellipse(-1,11,13,11,0,0,7);ctx.clip();
  ctx.fillStyle='#ff9933';ctx.beginPath();ctx.moveTo(-14,3);ctx.lineTo(-4,0);ctx.lineTo(12,22);ctx.lineTo(2,25);ctx.fill();
  ctx.restore();
  ctx.save();ctx.translate(-7,9);ctx.rotate(Math.sin(flap)*0.9-0.3);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-6,0,9,4.5,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(-14.5,0,3.2,0,7);ctx.fill();ctx.stroke();
  ctx.restore();
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(2,-6,11,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(12.5,-2,3.5,3,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(2,-6,11,Math.PI*1.12,Math.PI*1.88);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(2.5,3,9,6,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle=line;
  ctx.beginPath();ctx.arc(-1,-5,1.7,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(7,-5,1.7,0,7);ctx.fill();
  ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(-4,-8.5);ctx.lineTo(2,-8.5);ctx.moveTo(5,-8.5);ctx.lineTo(10,-8.5);ctx.stroke();
  ctx.beginPath();ctx.arc(4,1.5,3,Math.PI*.15,Math.PI*.85);ctx.stroke();
  ctx.restore();
}

/* ---------- mute / unmute button ---------- */
const BTN={x:W-46,y:14,w:34,h:34};
function inBtn(wx,wy){
  const p=8;
  return wx>=BTN.x-p&&wx<=BTN.x+BTN.w+p&&wy>=BTN.y-p&&wy<=BTN.y+BTN.h+p;
}
function drawSoundBtn(){
  const {x,y,w,h}=BTN,on=!Snd.isMuted();
  ctx.fillStyle='rgba(255,255,255,.9)';rr(x,y,w,h,10);ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle='#000080';ctx.stroke();
  ctx.fillStyle='#000080';
  ctx.beginPath();
  ctx.moveTo(x+8,y+14);ctx.lineTo(x+13,y+14);ctx.lineTo(x+19,y+9);
  ctx.lineTo(x+19,y+25);ctx.lineTo(x+13,y+20);ctx.lineTo(x+8,y+20);
  ctx.closePath();ctx.fill();
  ctx.lineCap='round';
  if(on){
    ctx.lineWidth=2;ctx.strokeStyle='#000080';
    ctx.beginPath();ctx.arc(x+19,y+17,5,-0.9,0.9);ctx.stroke();
    ctx.beginPath();ctx.arc(x+19,y+17,9,-0.9,0.9);ctx.stroke();
  }else{
    ctx.lineWidth=2.4;ctx.strokeStyle='#c2185b';
    ctx.beginPath();ctx.moveTo(x+22,y+12);ctx.lineTo(x+29,y+22);
    ctx.moveTo(x+29,y+12);ctx.lineTo(x+22,y+22);ctx.stroke();
  }
  ctx.lineCap='butt';
}

/* ---------- UI ---------- */
function ui(){
  if(state==='ready'){
    txt('Ashborn',W/2,H*0.17,54,'#fff','#000080');
    txt('Flappy',W/2,H*0.17+52,46,'#fff','#000080');
    txt('Tricolour Edition',W/2,H*0.17+92,20,'#000080');
    ctx.globalAlpha=.65+.35*Math.sin(t*5);
    txt('Tap anywhere to fly',W/2,H*0.68,24,'#fff','#000080');
    ctx.globalAlpha=1;
    txt('Best: '+best,W/2,H*0.68+40,20,'#fff','#000080');
  }else if(state==='play'){
    txt(String(score),W/2,80,58,'#fff','#000080');
  }else{
    const px=W/2-140,py=H/2-125;
    ctx.fillStyle='rgba(255,255,255,.96)';rr(px,py,280,250,22);ctx.fill();
    ctx.lineWidth=4;ctx.strokeStyle='#000080';ctx.stroke();
    txt('Game over',W/2,py+44,34,'#000080');
    txt('Score',W/2-70,py+86,16,'#555');
    txt(String(score),W/2-70,py+124,44,'#d96a00');
    txt('Best',W/2+70,py+86,16,'#555');
    txt(String(best),W/2+70,py+124,44,'#138808');
    if(newBest)txt('New best!',W/2,py+160,18,'#c2185b');
    ctx.fillStyle='#ff9933';rr(W/2-80,py+180,160,48,24);ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='#000080';ctx.stroke();
    txt('Restart',W/2,py+205,24,'#000080');
  }
  drawSoundBtn();
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#10230f';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR*S,0,0,DPR*S,OX*DPR,OY*DPR);
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  background();drawPipes();ground();drawBird();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.7)+')';ctx.fillRect(0,0,W,H)}
  ui();
  ctx.restore();
}

/* ---------- input & loop ---------- */
// Mobile browsers only allow audio after a user gesture, so unlock on every kind of first touch.
['pointerdown','pointerup','touchend','click','keydown'].forEach(ev=>
  window.addEventListener(ev,()=>Snd.unlock(),{passive:true}));
document.addEventListener('visibilitychange',Snd.onVisibility);

cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  Snd.unlock();
  const wx=(e.clientX-OX)/S,wy=(e.clientY-OY)/S;
  if(inBtn(wx,wy)){Snd.toggle();return}
  press();
});
window.addEventListener('keydown',e=>{
  if(e.code==='KeyM'){Snd.toggle();return}
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='Enter'){e.preventDefault();if(!e.repeat)press()}
});
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,100));

resize();makeGradients();reset();render();
let last=performance.now();
function loop(n){
  const dt=Math.min(.033,Math.max(0,(n-last)/1000));last=n;
  update(dt);render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
