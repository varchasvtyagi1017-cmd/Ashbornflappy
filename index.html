<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ashborn Flappy</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
let W,H,started=false,over=false,score=0;
let bird={x:80,y:200,v:0};
let pipes=[];

function resize(){
W=c.width=innerWidth;
H=c.height=innerHeight;
bird.x=W*.25;
}
resize();
window.addEventListener("resize",resize);

function start(){
bird.y=H*.4;
bird.v=0;
pipes=[];
score=0;
started=true;
over=false;
}

function jump(){
if(!started||over)start();
bird.v=-7;
}

c.addEventListener("pointerdown",jump);

function drawBird(){
ctx.fillStyle="#e9b58b";
ctx.beginPath();
ctx.arc(bird.x,bird.y,19,0,Math.PI*2);
ctx.fill();

// White hair and beard
ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(bird.x,bird.y-12,17,Math.PI,Math.PI*2);
ctx.fill();
ctx.beginPath();
ctx.arc(bird.x,bird.y+8,13,0,Math.PI);
ctx.fill();

// Eyes and nose
ctx.fillStyle="#222";
ctx.fillRect(bird.x-7,bird.y-5,3,3);
ctx.fillRect(bird.x+5,bird.y-5,3,3);
ctx.fillRect(bird.x-1,bird.y,3,6);

// Orange clothes
ctx.fillStyle="#ff9933";
ctx.fillRect(bird.x-15,bird.y+18,30,17);
}

function draw(){
ctx.fillStyle="#72c9e0";
ctx.fillRect(0,0,W,H);

// Indian flag colours
ctx.fillStyle="#ff9933";
ctx.fillRect(0,0,W,12);
ctx.fillStyle="#138808";
ctx.fillRect(0,H-25,W,25);

ctx.fillStyle="white";
ctx.font="bold 24px Arial";
ctx.textAlign="center";
ctx.fillText("ASHBORN FLAPPY 🪷",W/2,45);

pipes.forEach(p=>{
ctx.fillStyle="#138808";
ctx.fillRect(p.x,0,55,p.top);
ctx.fillRect(p.x,p.top+155,55,H);
ctx.fillStyle="#ff9933";
ctx.fillRect(p.x-5,p.top-15,65,15);
ctx.fillRect(p.x-5,p.top+155,65,15);
});

drawBird();

ctx.fillStyle="white";
ctx.font="bold 28px Arial";
ctx.fillText("Score: "+score,W/2,85);

if(!started||over){
ctx.fillStyle="rgba(0,0,0,.65)";
ctx.fillRect(0,0,W,H);
ctx.fillStyle="white";
ctx.font="bold 27px Arial";
ctx.fillText(over?"GAME OVER":"MODI EDITION",W/2,H*.42);
ctx.font="20px Arial";
ctx.fillText(over?"Score: "+score+" | TAP TO RESTART":"TAP TO START",W/2,H*.49);
}
}

function update(){
if(started&&!over){
bird.v+=.4;
bird.y+=bird.v;

if(pipes.length===0||pipes[pipes.length-1].x<W-220){
let top=100+Math.random()*(H-330);
pipes.push({x:W,top:top,passed:false});
}

pipes.forEach(p=>{
p.x-=3;
if(!p.passed&&p.x+55<bird.x){
p.passed=true;
score++;
}
if(bird.x+14>p.x&&bird.x-14<p.x+55&&
(bird.y-14<p.top||bird.y+14>p.top+155)){
over=true;
}
});

pipes=pipes.filter(p=>p.x>-60);

if(bird.y>H-25||bird.y<0)over=true;
}
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
